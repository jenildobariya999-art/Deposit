<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --text:#f2f4ff; --muted:#9aa4c7; --amber:#ffb703; --coral:#ff5d73; --teal:#2ee6c5; --violet:#7b5cff;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0; min-height:100%; display:flex; align-items:center; justify-content:center; padding:20px 14px; font-family:"Outfit",system-ui,sans-serif; color:var(--text); background:var(--bg); overflow-x:hidden}
.aurora{position:fixed; inset:0; z-index:-1; overflow:hidden}
.aurora i{position:absolute; width:55vmax; height:55vmax; border-radius:50%; filter:blur(80px); opacity:.45; animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--violet); top:-20vmax; left:-15vmax}
.aurora i:nth-child(2){background:var(--teal); bottom:-25vmax; right:-15vmax; animation-duration:23s; opacity:.32}
.aurora i:nth-child(3){background:var(--coral); top:35%; left:45%; width:30vmax; height:30vmax; animation-duration:15s; opacity:.22}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.2)}}

.card{display:none; width:100%; max-width:440px; padding:32px 24px 26px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:32px; backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12)}
body[data-view=amount] #amountView,
body[data-view=loading] #loadingView,
body[data-view=qr] #qrView,
body[data-view=result] #resultView{display:block; animation:cardIn .7s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes cardIn{from{opacity:0; transform:translateY(40px) scale(.94)}}

.coin{width:92px; height:92px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; font-size:46px; font-weight:800; color:#5a3b00; background:radial-gradient(circle at 30% 25%,#ffe38a,var(--amber) 55%,#c98500); box-shadow:0 12px 30px rgba(255,183,3,.45), inset 0 -6px 10px rgba(0,0,0,.18); animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-10px) rotate(8deg)}}
h1{margin:0 0 6px; font-size:1.7rem; font-weight:700}
.sub{margin:0 0 22px; color:var(--muted)}
.field{display:flex; align-items:center; gap:10px; padding:0 22px; height:76px; border-radius:22px; background:rgba(0,0,0,.28); border:1px solid var(--line); transition:.25s}
.field:focus-within{border-color:var(--amber); box-shadow:0 0 0 4px rgba(255,183,3,.2)}
.field b{font-size:2rem; color:var(--amber)}
.field input{flex:1; min-width:0; border:0; outline:0; background:none; color:var(--text); font:700 2.2rem "Outfit",sans-serif}
.field input::placeholder{color:#5d688f}
.field.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chips{display:flex; gap:10px; margin:14px 0 8px}
.chips button{flex:1; padding:9px 0; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--text); font:600 1rem "Outfit",sans-serif; cursor:pointer; transition:.2s}
.chips button:hover{background:rgba(255,183,3,.18); border-color:var(--amber); transform:translateY(-2px)}
.limits{margin:6px 0 24px; color:var(--muted); font-size:.9rem}
.btn{position:relative; overflow:hidden; display:block; width:100%; height:62px; margin-bottom:12px; border:0; border-radius:20px; font:700 1.15rem "Outfit",sans-serif; cursor:pointer; color:#1b1200; transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6; cursor:wait}
.btn-main{background:linear-gradient(120deg,#ffd166,var(--amber) 50%,#ff9b00); box-shadow:0 10px 28px rgba(255,183,3,.35)}
.btn-main::after{content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(-20deg); animation:shine 3s infinite}
@keyframes shine{60%,100%{left:130%}}
.secure{margin:14px 0 0; color:var(--muted); font-size:.9rem}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--teal); outline-offset:3px}

#loadingView{padding:70px 24px}
.orbit{position:relative; width:110px; height:110px; margin:0 auto 26px}
.orbit span{position:absolute; inset:0; border-radius:50%; border:3px solid transparent; border-top-color:var(--amber); animation:spin 1s linear infinite}
.orbit span:nth-child(2){inset:14px; border-top-color:var(--teal); animation-duration:1.4s; animation-direction:reverse}
.orbit span:nth-child(3){inset:28px; border-top-color:var(--coral); animation-duration:.8s}
.orbit em{position:absolute; inset:0; display:grid; place-items:center; font-style:normal; font-size:30px}
@keyframes spin{to{transform:rotate(360deg)}}
.dots::after{content:""; animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.step{margin:0 0 10px; color:var(--muted); font-size:.85rem; font-weight:600; text-align:left}
.step b{color:var(--amber)}
.amt{font-size:3rem; font-weight:800; margin:0 0 14px; line-height:1.1; background:linear-gradient(90deg,#fff,var(--amber)); -webkit-background-clip:text; background-clip:text; color:transparent}
.qrbox{position:relative; width:260px; max-width:100%; margin:0 auto 14px; padding:15px; border-radius:26px; background:#fff; animation:glow 2.4s ease-out infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(46,230,197,.5)}70%,100%{box-shadow:0 0 0 22px rgba(46,230,197,0)}}
#qr{width:100%; aspect-ratio:1; display:grid; place-items:center; animation:qrIn .8s .1s both}
#qr img,#qr canvas{width:100%!important; height:auto!important; display:block}
@keyframes qrIn{from{opacity:0; transform:scale(.7) rotate(-6deg); filter:blur(8px)}}
.scan{position:absolute; left:15px; right:15px; top:15px; height:3px; border-radius:3px; background:var(--teal); box-shadow:0 0 14px 3px var(--teal); animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 18px)}}
.qrlogo{position:absolute; top:50%; left:50%; width:48px; height:48px; transform:translate(-50%,-50%); border-radius:14px; background:#fff; display:grid; place-items:center; font-size:26px; font-weight:800; color:#0b1020; box-shadow:0 0 0 4px #fff}
.upi{display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 12px; color:var(--muted); font-size:.95rem; word-break:break-all}
.upi button{background:none; border:1px solid var(--line); color:var(--amber); border-radius:10px; padding:4px 10px; font:600 .85rem "Outfit",sans-serif; cursor:pointer}
.timer{margin:0 auto 16px; max-width:260px}
.timer p{margin:0 0 6px; font-weight:600; font-size:.95rem}
.bar{height:6px; border-radius:6px; background:rgba(255,255,255,.14); overflow:hidden}
.bar i{display:block; height:100%; width:100%; border-radius:6px; background:linear-gradient(90deg,var(--teal),var(--amber),var(--coral)); transform-origin:left; transition:transform 1s linear}
.pay{display:flex; align-items:center; justify-content:center; gap:8px; height:56px; margin-bottom:20px; border-radius:18px; background:var(--teal); color:#032b24; font:700 1.05rem "Outfit",sans-serif; text-decoration:none; box-shadow:0 8px 22px rgba(46,230,197,.3); transition:.2s}
.pay:hover{transform:translateY(-2px)}
.verify{padding-top:16px; border-top:1px dashed var(--line)}
.verify .field{height:60px; margin-bottom:12px; border-radius:18px}
.verify .field input{font:500 1.15rem "JetBrains Mono",monospace; letter-spacing:.04em}
#statusMsg{min-height:1.3em; margin:4px 0 0; color:var(--coral); font-weight:600; font-size:.9rem}

.mark{width:104px; height:104px; margin:6px auto 16px; display:block}
.mark circle{fill:none; stroke-width:5; stroke-dasharray:300; stroke-dashoffset:300; animation:draw .7s .1s forwards}
.mark path{fill:none; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:70; stroke-dashoffset:70; animation:draw .5s .7s forwards}
.ok .mark *{stroke:var(--teal)} .bad .mark *{stroke:var(--coral)} .warn .mark *{stroke:var(--amber)}
@keyframes draw{to{stroke-dashoffset:0}}
.rows{margin:18px 0 12px; border:1px solid var(--line); border-radius:18px; overflow:hidden; text-align:left; background:rgba(0,0,0,.2)}
.rows div{display:flex; justify-content:space-between; gap:16px; padding:11px 16px; border-bottom:1px solid var(--line); font-size:.95rem}
.rows div:last-child{border:0}
.rows span{color:var(--muted); text-transform:capitalize; flex:none}
.rows b{font:500 .9rem "JetBrains Mono",monospace; text-align:right; word-break:break-all}
.note{margin:0 0 14px; padding:10px 14px; border-radius:14px; font-weight:600; font-size:.92rem}
.note.good{background:rgba(46,230,197,.14); color:var(--teal)} .note.alert{background:rgba(255,183,3,.14); color:var(--amber)}
details{margin-bottom:16px; text-align:left; color:var(--muted); font-size:.85rem}
details pre{margin:8px 0 0; padding:12px; border-radius:12px; background:rgba(0,0,0,.3); white-space:pre-wrap; word-break:break-all; font:500 .8rem "JetBrains Mono",monospace; color:var(--text)}
.confetti{position:fixed; top:-12px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards; pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media(max-width:360px){.card{padding:26px 16px 22px}.amt{font-size:2.5rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important}}
</style>
</head>
<body data-view="amount">
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- 1. Amount (only shown when the link has no amount) -->
<main class="card" id="amountView">
  <div class="coin" aria-hidden="true">₹</div>
  <h1>Add money</h1>
  <p class="sub">Enter an amount and we'll make your UPI QR.</p>
  <label class="field" id="field"><b>₹</b>
    <input id="amount" type="number" inputmode="decimal" min="1" max="10000000" placeholder="0" aria-label="Amount in rupees">
  </label>
  <div class="chips">
    <button type="button" data-amt="100">₹100</button>
    <button type="button" data-amt="500">₹500</button>
    <button type="button" data-amt="1000">₹1,000</button>
  </div>
  <p class="limits">Min ₹1 · Max ₹1,00,00,000</p>
  <button class="btn btn-main" id="proceedBtn" type="button">Generate QR</button>
  <p class="secure">🔒 Secure UPI payment</p>
</main>

<!-- 2. Loading -->
<section class="card" id="loadingView" aria-live="polite">
  <div class="orbit"><span></span><span></span><span></span><em>⚡</em></div>
  <h1 id="loadTitle">Creating payment<span class="dots"></span></h1>
  <p class="sub" id="loadSub">Generating your secure QR.</p>
</section>

<!-- 3. QR + verify -->
<section class="card" id="qrView">
  <p class="step"><b>Step 1</b> · Scan the QR or tap Pay Now</p>
  <div class="amt" id="amountShown">₹1</div>
  <div class="qrbox">
    <div id="qr" role="img" aria-label="UPI payment QR code"></div>
    <div class="scan" aria-hidden="true"></div>
    <div class="qrlogo" aria-hidden="true">₹</div>
  </div>
  <div class="upi"><span id="upiText"></span><button id="copyBtn" type="button">Copy</button></div>
  <div class="timer" role="timer">
    <p>Time left: <span id="timeLeft">29:59</span></p>
    <div class="bar"><i id="barFill"></i></div>
  </div>
  <a class="pay" id="payNowBtn" href="#">➤ Pay Now</a>
  <div class="verify">
    <p class="step"><b>Step 2</b> · Enter your UTR / transaction ID</p>
    <label class="field" id="utrField"><input id="utr" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 412345678901" aria-label="UTR or transaction ID"></label>
    <button class="btn btn-main" id="verifyBtn" type="button">Verify payment</button>
    <p id="statusMsg" role="status"></p>
  </div>
</section>

<!-- 4. Result -->
<section class="card" id="resultView" aria-live="polite">
  <svg class="mark" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="48"/><path id="markPath" d="M33 57l16 16 29-33"/></svg>
  <h1 id="resTitle"></h1>
  <p class="sub" id="resSub"></p>
  <div id="resNote"></div>
  <div class="rows" id="resRows"></div>
  <details><summary>Raw response</summary><pre id="rawJson"></pre></details>
  <button class="btn btn-main" id="againBtn" type="button">Done</button>
</section>

<!--
  script.js is NOT loaded here: it replaces the whole page with raw JSON.
  Its logic (same ?details= UTR check, same API URL) now lives below.
  Raw mode is kept: open  ?details=UTR&format=json  to get the old plain JSON output.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var UPI_ID = "dobariya.jenish@fam", PAYEE = "Jenish Dobariya", TOTAL = 30*60;
  var API = "https://script.google.com/macros/s/AKfycbx-mJyjZLjFLhjSzp-2F8Hz3ThNDtZ75xbujAtqL2aApNVlktLHO6fMp772lNOtJKPN/exec";
  var params = new URLSearchParams(window.location.search);
  var utrParam = (params.get("details") || "").trim();
  var amtParam = parseFloat(params.get("amount"));
  var hasAmt = isFinite(amtParam) && amtParam >= 1 && amtParam <= 10000000;
  var amount = hasAmt ? Math.round(amtParam*100)/100 : null;
  var body = document.body, timer = null;
  function $(id){ return document.getElementById(id); }
  function view(v){ body.setAttribute("data-view", v); }
  function apiUrl(utr){ return API + "?utr=" + encodeURIComponent(utr) + (amount ? "&amount=" + amount : ""); }
  function fmt(n){ return "₹" + Number(n).toLocaleString("en-IN"); }

  /* ---- Raw JSON mode: same output as the original script.js ---- */
  if (params.get("format") === "json" || params.get("raw") === "1") {
    body.style = "margin:8px; font-family:monospace; font-size:13px; background:white; color:black; word-wrap:break-word;";
    if (!utrParam) { body.innerText = JSON.stringify({success:false, error:"Invalid format"}); return; }
    fetch(apiUrl(utrParam)).then(function(r){ return r.json(); })
      .then(function(d){ body.innerText = JSON.stringify(d); })
      .catch(function(e){ body.innerText = JSON.stringify({success:false, error:e.message}); });
    return;
  }

  /* ---- QR ---- */
  function upiLink(){
    var u = "upi://pay?pa=" + encodeURIComponent(UPI_ID) + "&pn=" + encodeURIComponent(PAYEE) + "&cu=INR";
    if (amount) u += "&am=" + amount.toFixed(2) + "&tn=" + encodeURIComponent("Deposit Rs " + amount);
    return u;
  }
  function makeQR(link){
    var box = $("qr"); box.innerHTML = "";
    if (window.QRCode) new QRCode(box, {text:link, width:512, height:512, colorDark:"#0b1020", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.H});
    else box.innerHTML = '<p style="color:#0b1020;font-weight:600">QR library could not load. Check your internet connection.</p>';
  }
  function startTimer(){
    clearInterval(timer);
    var s = TOTAL, t = $("timeLeft"), bar = $("barFill");
    (function tick(){
      t.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
      bar.style.transform = "scaleX(" + (s/TOTAL) + ")";
      if (s <= 0) { clearInterval(timer); $("statusMsg").textContent = "This QR has expired. Ask for a new link."; return; }
      s--; timer = setTimeout(tick, 1000);
    })();
  }
  function showQR(){
    $("loadTitle").innerHTML = 'Creating payment<span class="dots"></span>';
    $("loadSub").textContent = "Generating your secure QR."; view("loading");
    setTimeout(function(){
      var link = upiLink();
      $("amountShown").textContent = fmt(amount);
      $("upiText").textContent = UPI_ID;
      $("payNowBtn").href = link; $("statusMsg").textContent = "";
      makeQR(link); startTimer(); view("qr");
    }, 1300);
  }

  /* ---- UTR check (same API as script.js) ---- */
  function flat(o, out, pre, depth){
    Object.keys(o).forEach(function(k){
      var v = o[k];
      if (v && typeof v === "object" && depth < 2) flat(v, out, pre + k + " ", depth + 1);
      else if (v !== null && typeof v !== "object") out.push([(pre + k).replace(/[_-]/g, " "), String(v)]);
    });
    return out;
  }
  function confetti(){
    var c = ["#ffb703","#2ee6c5","#ff5d73","#7b5cff","#fff"];
    for (var i = 0; i < 60; i++) {
      var d = document.createElement("div"); d.className = "confetti";
      d.style.left = Math.random()*100 + "vw"; d.style.background = c[i % c.length];
      d.style.animationDuration = (1.8 + Math.random()*1.8) + "s"; d.style.animationDelay = Math.random()*.5 + "s";
      document.body.appendChild(d); setTimeout(function(el){ el.remove(); }, 4500, d);
    }
  }
  function result(kind, title, sub, data, utr){
    var card = $("resultView"); card.className = "card " + kind;
    $("markPath").setAttribute("d", kind === "ok" ? "M33 57l16 16 29-33" : kind === "warn" ? "M55 32v32M55 79v1" : "M38 38l34 34M72 38L38 72");
    $("resTitle").textContent = title; $("resSub").textContent = sub;
    var rows = $("resRows"); rows.innerHTML = ""; $("resNote").innerHTML = "";
    var list = data && typeof data === "object" ? flat(data, [], "", 0) : [];
    if (utr) list.unshift(["utr", utr]);
    var seen = {};
    list.filter(function(r){ return !seen[r[0]] && (seen[r[0]] = 1); }).forEach(function(r){
      var d = document.createElement("div"), s = document.createElement("span"), b = document.createElement("b");
      s.textContent = r[0]; b.textContent = r[1]; d.appendChild(s); d.appendChild(b); rows.appendChild(d);
    });
    rows.style.display = rows.children.length ? "" : "none";
    $("rawJson").textContent = JSON.stringify(data, null, 2);
    view("result"); if (kind === "ok") confetti();
    return list;
  }
  function verify(utr){
    clearTimeout(timer);
    $("loadTitle").innerHTML = 'Checking your payment<span class="dots"></span>';
    $("loadSub").textContent = "Looking up UTR " + utr; view("loading");
    var url = new URL(window.location.href); url.searchParams.set("details", utr);
    if (amount) url.searchParams.set("amount", amount);
    history.replaceState(null, "", url);
    fetch(apiUrl(utr)).then(function(r){ return r.json(); }).then(function(data){
      var ok = data && (data.success === true || String(data.status).toLowerCase() === "success");
      if (!ok) {
        result("bad", "Payment not found", (data && (data.error || data.message)) || "We couldn't verify this UTR.", data, utr);
        return;
      }
      var list = flat(data, [], "", 0), got = NaN;
      list.some(function(r){ if (/amount|amt/i.test(r[0])) { got = parseFloat(r[1].replace(/[^\d.]/g, "")); return true; } });
      if (amount && isFinite(got) && Math.abs(got - amount) > 0.009) {
        result("warn", "Amount mismatch", "Paid " + fmt(got) + " but " + fmt(amount) + " was expected.", data, utr);
        $("resNote").innerHTML = '<p class="note alert">Please contact support with this UTR.</p>';
      } else {
        result("ok", "Payment verified", amount ? fmt(amount) + " received. Thank you!" : "Your payment was found.", data, utr);
        if (amount && isFinite(got)) $("resNote").innerHTML = '<p class="note good">Amount matches ' + fmt(amount) + '</p>';
      }
    }).catch(function(e){ result("bad", "Something went wrong", e.message, {success:false, error:e.message}, utr); });
  }

  /* ---- events ---- */
  $("proceedBtn").addEventListener("click", function(){
    var v = parseFloat($("amount").value);
    if (!v || v < 1 || v > 10000000) { var f = $("field"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); $("amount").focus(); return; }
    amount = Math.round(v*100)/100; showQR();
  });
  $("amount").addEventListener("keydown", function(e){ if (e.key === "Enter") $("proceedBtn").click(); });
  document.querySelectorAll(".chips button").forEach(function(b){ b.addEventListener("click", function(){ $("amount").value = b.getAttribute("data-amt"); }); });
  $("verifyBtn").addEventListener("click", function(){
    var u = $("utr").value.trim();
    if (u.length < 6) { var f = $("utrField"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); $("statusMsg").textContent = "Enter a valid UTR."; $("utr").focus(); return; }
    verify(u);
  });
  $("utr").addEventListener("keydown", function(e){ if (e.key === "Enter") $("verifyBtn").click(); });
  $("copyBtn").addEventListener("click", function(){
    var m = $("copyBtn");
    (navigator.clipboard ? navigator.clipboard.writeText(UPI_ID) : Promise.reject()).then(function(){ m.textContent = "Copied"; setTimeout(function(){ m.textContent = "Copy"; }, 1500); }, function(){ m.textContent = "Select ID"; });
  });
  $("againBtn").addEventListener("click", function(){ if (amount) { $("utr").value = ""; showQR(); } else view("amount"); });

  /* ---- start ---- */
  if (utrParam) verify(utrParam);
  else if (amount) showQR();
  else view("amount");
})();
</script>
</body>
</html>
